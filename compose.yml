services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5021:80'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME};User=${DB_USER};Password=${SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      - db

  frontend:
    build:
      context: ./PlaneCrashVisualizationClient
      dockerfile: Dockerfile_dev
    ports:
      - '5173:5173'
    volumes:
      - ./PlaneCrashVisualizationClient:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - '1433:1433'
    volumes:
      - dbdata:/var/opt/mssql
    restart: always
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s
  sqlserver.configurator:
    image: mcr.microsoft.com/mssql/server:2019-latest
    volumes:
      - ./Data/skript.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c '
      /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P ${SA_PASSWORD} -d master -i docker-entrypoint-initdb.d/init.sql;
      echo "All done!";
      '

volumes:
  dbdata:
  frontend_node_modules:
